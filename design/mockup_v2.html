 '+n(Math.max(0,p.end-60000)*100)+'원'}</text></svg></div>`};
home=function(){let html=originalHome().replace('이대로면 만기 거리 정산','계약 평균이 이어지면').replace('<span>┊ 현재 기준</span>','').replace('시연 데이터 ◇','[모의]');if(state.person==='lee')html=html.replace('−10 km/주','−50 km/주').replace('−14만 원','−69만 원');if(state.person==='jung')html=html.replace('연 1만 km <strong>검토 →</strong>','현재 연 8,750km → <strong>연 1만 검토</strong>');else{const start=html.lastIndexOf('<section class="tile">');html=html.slice(0,start)+`<section class="tile"><div class="pacehead"><span>주 몇 km로 타면?</span><span id="paceLabel">${state.pace===null?'현재':state.pace+' km'}</span></div><input class="pace" id="pace" type="range" min="200" max="450" step="1" value="${state.pace??(state.person==='lee'?416:294)}" aria-label="주간 주행거리 시나리오"><div class="caption">${state.person==='lee'?'−50 km/주 → 약 −69만 원':'−10 km/주 → 약 −14만 원'}</div></section></div>`}return html.replace('<div class="miniring">','<div class="miniring" role="button" tabindex="0" aria-label="이번 주 거리 상세">')};
week=function(){const included=state.trip,vals=[48,52,41,45,46,included?420:32,32],w=state.narrow?680:1500,l=76,r=w-35,slot=(r-l)/7,y=355,k=280/500;return `<section class="hero week-hero"><div class="hero-top"><div><div class="eyebrow">김 대리 · 이번 주</div><h2>${included?'강릉 다녀오면, 이렇게 조정돼요':'평소 이동으로 돌아왔어요'}</h2><div class="metrics"><div><strong>${included?'282 → 279':'282'}</strong><span>다녀오면 목표 km/주${included?' · 지금 282':''}</span></div><div><strong>${included?684:296}</strong><span>이번 주 예상 km</span></div></div></div><div class="moneyblock"><div class="eyebrow">평소 토요일 대비 만기 정산</div><div class="amount accent">${included?'+3.9':'0'}<small>만 원</small></div></div></div><div class="weekchart"><svg viewBox="0 0 ${w} 470" role="img" aria-label="요일별 거리"><line x1="${l}" y1="${y}" x2="${r}" y2="${y}" stroke="var(--line)"/>${[0,250,500].map(v=>`<text x="4" y="${y-v*k+8}">${v}</text>`).join('')}<line x1="${l}" x2="${r}" y1="${y-282/7*k}" y2="${y-282/7*k}" stroke="var(--muted)" stroke-dasharray="8 8"/>${vals.map((v,i)=>{const x=l+(i+.22)*slot,bw=slot*.56;return `<rect tabindex="0" role="button" data-value="${['월','화','수','목','금','토','일'][i]}요일 ${v} km" aria-label="${['월','화','수','목','금','토','일'][i]}요일 ${v}km" x="${x}" y="${y-v*k}" width="${bw}" height="${v*k}" rx="6" fill="${i===5&&included?'var(--blue)':i<4?'var(--muted)':'var(--raised)'}" stroke="var(--muted)"/><text x="${x+bw/2}" y="${y+40}" text-anchor="middle">${['월','화','수','목','금','토','일'][i]}</text>${i===5&&included?`<rect x="${x+bw/2-65}" y="${y-v*k-60}" width="130" height="42" rx="12" fill="var(--blue)"/><text x="${x+bw/2}" y="${y-v*k-30}" text-anchor="middle" style="fill:var(--bg)">+3.9만</text>`:''}`}).join('')}<text x="${l}" y="455">km / 요일</text><text x="${r}" y="455" text-anchor="end">┄ 지금 목표 주 282km</text></svg></div>${included?'<div class="longtrip">평소보다 긴 이동 · 토요일 강릉 420km / 평소보다 +388km</div><div class="adjustline"><span>남은 기간 매주 3km 덜 타면 0원 유지</span><button data-new="removeTrip">계획에서 빼기</button></div>':'<div class="adjustline"><button data-new="addTrip">강릉 계획 다시 넣기</button></div>'}<div class="legend"><span>● 관측</span><span>□ 평소</span><span><i class="dot blue"></i>예정</span><button class="quiet" data-action="why">왜?</button></div></section>`};
function miniProof(){const w=state.narrow?680:1500,max=91431*1.15,x=v=>20+(w-40)*v/max;return `<div class="miniproof"><svg viewBox="0 0 ${w} 125" aria-label="31228km 사용, 만기91431km, 초과31431km"><line x1="20" y1="30" x2="${x(91431)}" y2="30" stroke="var(--track)" stroke-width="20"/><line x1="20" y1="30" x2="${x(31228)}" y2="30" stroke="var(--muted)" stroke-width="20"/><line x1="${x(60000)}" y1="30" x2="${x(91431)}" y2="30" stroke="var(--blue)" stroke-width="20"/><line x1="${x(60000)}" y1="8" x2="${x(60000)}" y2="52" stroke="var(--text)"/><text x="20" y="84">31,228 km 사용 → 만기 91,431 km</text><text x="20" y="117">약정 +31,431 km → 반납 최소 314만 원</text></svg></div>`}
exits=function(){const group=(title,rows,note,cls='')=>{const max=Math.ceil(Math.max(...rows.map(r=>r[1]??0))*1.15/10)*10;return `<div class="group ${cls}"><h3>${title}</h3>${rows.map(([label,v,kind])=>`<div class="barrow"><div class="barlabel"><span>${label}</span><span>${v===null?'미확인':v+'만'+(kind==='dashed'?' +':' 원')}</span></div>${label.includes("반납")?'<div class="caption" style="margin-bottom:8px">(31,431km × 100원)</div>':''}<div class="bartrack">${v===null?'<div class="unknown">—</div>':`<div class="barfill ${kind}" style="width:${v/max*100}%"></div>`}</div></div>`).join('')}<div class="axislabels"><span>0</span><span>${max/2}</span><span>${max}만 원</span></div><div class="group-note">${note}</div></div>`};return `<section class="hero exit-hero"><div class="hero-top"><div><div class="eyebrow">이 과장 · 출구</div><h2>만기까지 탈 때의 선택부터</h2></div><div class="moneyblock"><div class="eyebrow">만기까지 타기 중 최저 · 인수 후 보유</div><div class="amount accent">176<small>만 원</small></div></div></div>${miniProof()}<div class="exitgroups">${group('만기까지 타고 나서',[['인수 후 보유',176,'best'],['반납 · 최소',314,'dashed'],['인수 후 매각',176,'dashed']],'월 이용료 공통 · 제외')}${group('지금 나가면',[['승계 · 확인 전',300,'dashed'],['지금 해지',null,'']],'대체 이동비 확인 전 · 독립 축','groupsplit')}</div><div class="exit-summary"><span class="chip">인수 시 준비할 돈 <strong>1,926만</strong></span><button class="quiet" data-action="why">왜? · 상세</button></div><div class="legend"><span><i class="dot blue"></i>묶음 내 최저</span><span>▧ 빠진 비용 별도</span><span>묶음별 독립 축</span></div></section>`};
function forecastView(){const extra=state.commute?13714:0,low=61660+(state.commute?11000:0),high=62353.5+extra,w=state.narrow?680:1500,l=80,r=w-50,max=high*1.15,Y=v=>300-v/max*240,now=l+(r-l)*501/1461;return `<section class="hero forecasthero"><div class="hero-top"><div><div class="eyebrow">김 대리 · 예측</div><h2>습관이 바뀌면, 범위도 바뀌어요</h2></div><div class="moneyblock"><div class="eyebrow">계약 평균이 이어지면</div><div class="amount accent">${fmtMan((high-60000)*100)}<small>만 원</small></div></div></div><div class="forecastchart"><svg viewBox="0 0 ${w} 370" aria-label="최근4주 습관과 계약평균의 만기 범위"><line x1="${l}" y1="300" x2="${r}" y2="300" stroke="var(--line)"/><text x="0" y="45">${n(max)}</text><text x="10" y="300">0 km</text><line x1="${l}" x2="${r}" y1="${Y(60000)}" y2="${Y(60000)}" stroke="var(--muted)" stroke-dasharray="8 8"/><text x="${l}" y="${Y(60000)-15}">약정 60,000</text><path d="M${now} ${Y(21382)} L${r} ${Y(low)} L${r} ${Y(high)} Z" fill="var(--blue)" opacity=".25"/><line x1="${now}" y1="${Y(21382)}" x2="${r}" y2="${Y(high)}" stroke="var(--blue)" stroke-width="4"/><circle cx="${now}" cy="${Y(21382)}" r="7" fill="var(--muted)"/><text x="${l}" y="350">시작</text><text x="${now}" y="350" text-anchor="middle">오늘</text><text x="${r}" y="350" text-anchor="end">만기</text></svg></div><div class="adjustline"><span>최근 4주 습관 ${n(low)} km</span><span>계약 평균 ${n(high)} km</span></div><div class="scenariochips"><button class="${state.commute?'on':''}" data-new="commute" aria-pressed="${state.commute}">통근 +20km/일 ${state.commute?'적용 중':''}</button><button class="quiet" data-action="why">왜?</button></div><div class="caption" style="margin-top:24px">● 관측점 · ▰ 예상 범위 · ┄ 약정선 · [모의]</div></section>`}
function contractView(){const items=[['만기일','2030.10.31',true],['총 약정거리','60,000 km',true],['초과 단가','100원/km',true],['공제 거리',state.confirmed?'0 km':'확인하면 더 정확',state.confirmed],['만기 인수 면제','확인하면 더 정확',false],['덜 탄 거리 환급','확인하면 더 정확',false]];return `<section class="hero contracthero"><div class="eyebrow">내 계약</div><h2>확인한 조건만 채워요</h2><div class="checkgrid">${items.map(([label,value,ok],i)=>`<button class="checkitem" data-new="${i===3?'confirm':'condition'}"><i class="dot ${ok?'green':''}"></i>${label}<small>${value}</small></button>`).join('')}</div><div class="legend" style="margin-top:22px"><span><i class="dot green"></i>확인됨</span><span><i class="dot"></i>미확인</span><button class="quiet" data-action="why">왜?</button></div><div class="adjustline"><span>보험 마일리지 모드</span><button class="${state.insurance?'on':''}" data-new="insurance" aria-pressed="${state.insurance}">${state.insurance?'켜짐':'꺼짐'}</button></div>${state.insurance?'<div class="chiprow"><span class="chip">1.2만 km 구간 <strong>목표 주 245 km</strong></span></div>':''}</section>`}
why=function(){if(state.page==='home'){return originalWhy().replaceAll('499','501').replaceAll('20,493','20,575').replaceAll('약 7만','약 8만').replace('0–100,000km','0–max(만기 예상, 약정) × 1.15')}let body=state.page==='week'?'<p>토요일 강릉 420km − 평소 32km = +388km. 평소의 2배 이상 또는 +100km 이상 긴 이동만 조정 안내를 표시합니다.</p><p>이번 주 예상 684km → 현재 목표 282 → 다녀오면 279km/주. 남은 기간 매주 약 3km를 조정하면 초과 0원을 유지합니다. 평소 대비 추가 정산은 38,800원입니다.</p>':state.page==='exit'?'<p>반납: 초과 31,431km × 100원 = 3,143,100원. 손상·감가는 미확인입니다.</p><p>인수 보유: 1,926만 − 남는 차 가치 1,750만 = 176만 원. 매각은 같은 176만 원에 매각 비용이 더 들 수 있습니다.</p><p>두 묶음은 포함 비용이 달라 독립 축입니다. 승계 300만은 대체 이동비 확인 전입니다.</p>':state.page==='forecast'?'<p>범위 양 끝은 최근 4주 습관과 계약 평균이라는 서로 다른 가정입니다. 통계적 신뢰구간은 아닙니다.</p><p>통근 시나리오는 인터랙션 검토용 모의 민감도입니다. 실제 기간·반복일 계산은 엔진으로 연결합니다.</p>':'<p>녹색 점은 확인한 입력, 회색은 미확인입니다. 공제 카드 확인은 공제 없음(0km) 확인을 시연합니다.</p><p>보험 토글은 1.2만km 구간을 유지하는 주 245km 목표를 보여줍니다.</p>';return `<section class="explain" role="dialog" aria-modal="true" aria-label="계산 근거"><header><h2>숫자 뒤의 근거</h2><button data-action="close">닫기 ×</button></header>${body}<p>[모의] 정적 엔진 예시와 디자인 시연 값이며 실제 차량 수신이 아닙니다.</p></section>`};
render=function(resume=false){$('tabs').setAttribute('role','group');$('tabs').setAttribute('aria-label','홈 시연 인물');$('tabs').innerHTML=Object.entries(people).map(([key,p])=>`<button data-person="${key}" aria-selected="${state.person===key}">${p.name} 홈</button>`).join('');$('size').textContent=state.narrow?'가로 창 1682dp':'반쪽 창 840dp';$('theme').textContent=state.light?'다크':'라이트';$('gear').textContent=state.driving?'기어 D → P':'기어 P → D';$('frame').className='frame'+(state.narrow?' narrow':'')+(state.light?' light':'')+(state.driving?' driving':'');$('frame').innerHTML=state.driving?'<div class="lock"><div><h2>주행 중에는 화면을 쉬어 갑니다</h2><div class="sub" style="margin-top:25px">정차하면 보던 화면에서 이어집니다</div></div></div>':`<header><span class="brand">남은키로</span><span class="status">● 정차 중 · [모의]</span></header><nav role="tablist" aria-label="앱 화면">${[['home','홈'],['week','이번 주'],['forecast','예측'],['exit','출구'],['contract','계약']].map(([key,label])=>`<button role="tab" aria-selected="${state.page===key}" data-nav="${key}" class="${state.page===key?'on':'quiet'}">${label}</button>`).join('')}</nav><main id="appmain" class="${resume&&!reduceMotion()?'mainresume':''}">${({home,week,forecast:forecastView,exit:exits,contract:contractView}[state.page])()}</main><div class="tip" id="tip" role="status"></div>${state.why?why():''}`;resize();if(resume&&$('appmain'))$('appmain').scrollTop=state.savedScroll};
function showTip(text,e){if(state.driving||!$('tip'))return;const f=$('frame'),b=f.getBoundingClientRect(),k=b.width/f.clientWidth,x=e?.clientX?(e.clientX-b.left)/k:100,y=e?.clientY?(e.clientY-b.top)/k:300,t=$('tip');t.textContent=text;t.style.left=Math.max(16,Math.min(x+16,f.clientWidth-600))+'px';t.style.top=Math.max(100,Math.min(y+20,1050))+'px'}
function scrubMove(e){const el=e.target.closest('#scrub');if(!el||state.driving)return;const b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*el.viewBox.baseVal.width;scrubKm=Math.max(0,Math.min(+el.dataset.max,(x-Number(el.dataset.left))/(Number(el.dataset.right)-Number(el.dataset.left))*Number(el.dataset.max)));el.setAttribute('aria-valuenow',Math.round(scrubKm));showTip('이 지점 '+n(scrubKm)+' km · 정산 '+n(Math.max(0,scrubKm-60000)*100)+'원',e)}
function liveHome(){if(state.driving||state.page!=='home')return;const p=people[state.person],diagram=$('frame').querySelector('.diagram'),money=$('frame').querySelector('.amount');diagram.outerHTML=distanceDiagram(p);money.innerHTML=(p.end<60000?n(60000-p.end):fmtMan(Math.max(0,p.end-60000)*100))+'<small>'+(p.end<60000?' km':'만 원')+'</small>';if($('paceLabel'))$('paceLabel').textContent=state.pace===null?'현재':state.pace+' km'}
document.addEventListener('pointermove',scrubMove);document.addEventListener('pointerdown',e=>{const el=e.target.closest('#scrub');if(el&&!state.driving){el.setPointerCapture(e.pointerId);scrubMove(e)}});
document.addEventListener('input',e=>{if(e.target.id==='pace'&&!state.driving){cancelAnimationFrame(motion);state.pace=+e.target.value;const p=people[state.person];p.end=p.used+state.pace*(1461-501)/7;p.fee=+fmtMan(Math.max(0,p.end-60000)*100);liveHome()}});
document.addEventListener('click',e=>{const person=e.target.closest('[data-person]'),nav=e.target.closest('[data-nav]'),action=e.target.closest('[data-action]'),newAction=e.target.closest('[data-new]');if(person||nav||action||newAction){e.stopImmediatePropagation();if(state.driving)return;if(person){state.person=person.dataset.person;state.page='home';state.pace=null;Object.assign(people[state.person],basePeople[state.person]);state.extra=0}if(nav)state.page=nav.dataset.nav;if(action){const a=action.dataset.action;if(a==='why'||a==='reduction')state.why=true;if(a==='close')state.why=false;if(a==='week'||a==='exit')state.page=a}if(newAction){const a=newAction.dataset.new;if(['removeTrip','addTrip'].includes(a)){animatePlan(a);return}if(a==='removeTrip')state.trip=false;if(a==='addTrip')state.trip=true;if(a==='commute')state.commute=!state.commute;if(a==='insurance')state.insurance=!state.insurance;if(a==='confirm')state.confirmed=true;if(a==='condition')state.why=true}if(person||nav)state.why=false;render();return}const value=e.target.closest('[data-value]'),ring=e.target.closest('.miniring');if(value)showTip(value.dataset.value,e);if(ring)showTip('이번 주 '+people[state.person].week+'km / 목표 '+people[state.person].target+'km',e)},true);
document.addEventListener('keydown',e=>{if(state.driving)return;const el=e.target.closest('#scrub');if(el&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();if(scrubKm===0)scrubKm=Number(el.getAttribute('aria-valuenow')||0);scrubKm=e.key==='Home'?0:e.key==='End'?+el.dataset.max:Math.max(0,Math.min(+el.dataset.max,scrubKm+(e.key==='ArrowRight'?1000:-1000)));el.setAttribute('aria-valuenow',Math.round(scrubKm));showTip('이 지점 '+n(scrubKm)+' km · 정산 '+n(Math.max(0,scrubKm-60000)*100)+'원')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-value],.miniring')){e.preventDefault();showTip(e.target.dataset.value||'이번 주 '+people[state.person].week+' km')}});
$('gear').onclick=()=>{cancelAnimationFrame(motion);if(!state.driving)state.savedScroll=$('appmain')?.scrollTop??0;state.driving=!state.driving;state.why=false;render(!state.driving)};
const receive=document.createElement('button');receive.id='receive';receive.textContent='+12km 수신 [모의]';$('gear').parentElement.append(receive);receive.onclick=()=>{if(state.driving)return;state.page='home';state.pace=null;render();cancelAnimationFrame(motion);const p=people[state.person],oldUsed=p.used,oldEnd=p.end,start=performance.now();function step(t){if(state.driving)return;const q=reduceMotion()?1:Math.min(1,(t-start)/300);p.used=oldUsed+12*q;p.end=oldEnd+12*q*1461/501;p.fee=+fmtMan(Math.max(0,p.end-60000)*100);liveHome();if(q<1)motion=requestAnimationFrame(step);else{state.extra+=12;render()}}motion=requestAnimationFrame(step)};
$('audit').textContent='D4 · 5개 앱 탭 · 시연 인물은 프레임 밖에서 선택 · 수신/페이스는 모의 상호작용 · 움직임 줄이기 지원';render();
// 한 번에 하나의 데이터 변화만 움직인다. D에서는 즉시 정지, P 복귀만 짧게 페이드한다.
let pendingReading=null;
const safeGear=$('gear').onclick;
$('gear').onclick=()=>{if(pendingReading){pendingReading();pendingReading=null}safeGear()};
receive.onclick=()=>{if(state.driving)return;if(pendingReading)pendingReading();cancelAnimationFrame(motion);state.page='home';state.pace=null;render();const p=people[state.person],oldUsed=p.used,oldEnd=p.end,oldWeek=p.week,start=performance.now();pendingReading=()=>{p.used=oldUsed+12;p.end=oldEnd+12*1461/501;p.week=oldWeek+12;p.fee=+fmtMan(Math.max(0,p.end-60000)*100)};function step(t){if(state.driving)return;const q=reduceMotion()?1:Math.min(1,(t-start)/300);p.used=oldUsed+12*q;p.end=oldEnd+12*q*1461/501;p.fee=+fmtMan(Math.max(0,p.end-60000)*100);liveHome();if(q<1)motion=requestAnimationFrame(step);else{pendingReading();pendingReading=null;state.extra+=12;render()}}motion=requestAnimationFrame(step)};
const basicLiveHome=liveHome;
liveHome=function(){basicLiveHome();if(state.driving||state.page!=='home')return;const p=people[state.person];if(state.pace!==null){p.title='주 '+state.pace+'km로 타는 시나리오';p.range='슬라이더 가정 · [모의]';$('frame').querySelector('h2').textContent=p.title;$('frame').querySelector('.moneyblock .eyebrow').textContent='주 '+state.pace+'km 가정';$('frame').querySelector('.range').textContent=p.range;if(state.person!=='jung')$('frame').querySelector('.amount').innerHTML=fmtMan(Math.max(0,p.end-60000)*100)+'<small>만 원</small>'}};
// 요일 하나가 최소 76dp 이상의 터치 영역을 가진다.
const visualWeek=week;
week=function(){const w=state.narrow?680:1500,l=76,r=w-35,slot=(r-l)/7,values=[48,52,41,45,46,state.trip?420:32,32];const hits=values.map((v,i)=>`<rect fill="transparent" tabindex="0" role="button" aria-label="${['월','화','수','목','금','토','일'][i]}요일 ${v}km" data-value="${['월','화','수','목','금','토','일'][i]}요일 ${v} km" x="${l+i*slot}" y="45" width="${slot}" height="320"/>`).join('');return visualWeek().replaceAll('<rect tabindex="0" role="button"','<rect').replace('</svg>',hits+'</svg>')};
// 계획 추가/제거는 토요일 막대 하나만 300ms 보간한다.
document.addEventListener('click',e=>{const el=e.target.closest('[data-new]');if(!el||state.driving||!['removeTrip','addTrip'].includes(el.dataset.new))return;e.stopImmediatePropagation();cancelAnimationFrame(motion);const before=state.trip?420:32;state.trip=el.dataset.new==='addTrip';const after=state.trip?420:32;render();const rect=$('frame').querySelector('.weekchart rect[data-value^="토요일"]');if(!rect||reduceMotion())return;const start=performance.now();function step(t){if(state.driving)return;const q=Math.min(1,(t-start)/300),v=before+(after-before)*q;rect.setAttribute('height',v*.56);rect.setAttribute('y',355-v*.56);if(q<1)motion=requestAnimationFrame(step)}motion=requestAnimationFrame(step)},true);
render();
function animatePlan(action){cancelAnimationFrame(motion);const before=state.trip?420:32;state.trip=action==='addTrip';const after=state.trip?420:32;render();const rect=$('frame').querySelector('.weekchart rect[data-value]');const bars=[...$('frame').querySelectorAll('.weekchart rect[data-value]')];const bar=bars[5];if(!bar||reduceMotion())return;const start=performance.now();function step(t){if(state.driving)return;const q=Math.min(1,(t-start)/300),v=before+(after-before)*q;bar.setAttribute('height',v*.56);bar.setAttribute('y',355-v*.56);if(q<1)motion=requestAnimationFrame(step)}motion=requestAnimationFrame(step)}

$('size').onclick=()=>{state.narrow=!state.narrow;render()};$('theme').onclick=()=>{state.light=!state.light;render()};window.addEventListener('resize',resize);document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.why=false;render()}});
</script></body></html>
